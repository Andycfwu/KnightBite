name: Release checks
on:
  pull_request:
  push:
    # Release-branch runs check the exact candidate SHA; PR runs also check the
    # prospective merge. Main runs gate Vercel's final production commit.
    branches: [main, 'codex/release-*', 'codex/fix-partial-meal-loading']
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: KnightBite release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record checked commit and tree
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: git diff --check
      # Keep the named required check green only when the current hosting floor
      # passes the same complete gate as the preferred developer runtime.
      - name: Use the reviewed Vercel runtime floor
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --check
